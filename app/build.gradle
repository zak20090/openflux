plugins {
    id 'com.android.application'
}

android {
    namespace 'com.openflux.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.openflux.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "0.1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // TODO: добавить зависимость на реальный OpenFlux SDK, когда он будет доступен.
}
