plugins {
    id 'com.android.application'
}

android {
    namespace 'com.openflux.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.openflux.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "0.1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // OpenFlux SDK: локальный модуль-референс. Для внешнего SDK замените на
    // implementation 'com.openflux:openflux-sdk:<version>' и добавьте его Maven-репозиторий
    // в dependencyResolutionManagement (settings.gradle).
    implementation project(':openflux-sdk')
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
}
